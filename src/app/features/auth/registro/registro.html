<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo">🛒</div>
      <h2>Crear cuenta</h2>
      <p>Regístrate para empezar a comprar</p>
    </div>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="usuario@ejemplo.com"
          [class.is-invalid]="registroForm.controls.email.touched && registroForm.controls.email.invalid"
        />
        <span *ngIf="registroForm.controls.email.touched && registroForm.controls.email.errors?.['required']" class="error-msg">
          El correo es obligatorio.
        </span>
        <span *ngIf="registroForm.controls.email.touched && registroForm.controls.email.errors?.['email']" class="error-msg">
          Ingresa un correo válido.
        </span>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.is-invalid]="registroForm.controls.password.touched && registroForm.controls.password.invalid"
        />
        <span *ngIf="registroForm.controls.password.touched && registroForm.controls.password.errors?.['required']" class="error-msg">
          La contraseña es obligatoria.
        </span>
        <span *ngIf="registroForm.controls.password.touched && registroForm.controls.password.errors?.['minlength']" class="error-msg">
          Mínimo 6 caracteres.
        </span>
      </div>

      <div *ngIf="errorMessage()" class="alert-error">
        ⚠️ {{ errorMessage() }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Creando cuenta...' : 'Registrarme' }}
      </button>

      <p class="switch-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </p>
      
    </form>
  </div>
</div>
